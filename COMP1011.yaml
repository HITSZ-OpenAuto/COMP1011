misc:
  - content: |
      【关于实验（2024秋之前）】
      实验一共九次。前四次实验较简单，后五次实验难度较大，代码量较大，综合考察指针、数组、函数、结构体。每年实验几乎不变。助教答疑很随便。后五个实验需要在课后花大量时间（约2-4小时/个）才能写完。
    submitter:
      name: "lmh"
      link: "https://github.com/lmh12138"
  - content: |
      【关于实验（2024秋开始）】
      自 24 开始实验课发生大幅改动，具体实验内容根据课程进度。实验报告需要交 CodeBlocks 项目。最后两个实验是综合项目（单向链表改双向链表）。实验课最后一次有现场检查，会随机选一次实验让你用 Debug 调试，并讲解思路（原则上使用 CodeBlocks，但可与老师沟通使用其他 IDE）。
    submitter:
      name: "syhanjin"
      link: "https://github.com/syhanjin"